<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المستخدمين والصلاحيات | دوام الميسر</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#f6f8f5;color:#173d2b;margin:0;padding:16px}main{max-width:760px;margin:20px auto;background:#fff;padding:22px;border-radius:18px;box-shadow:0 4px 24px #0001}h1{font-size:1.4rem}select,button{padding:12px;border-radius:9px;font:inherit}select{border:1px solid #abb9ae;max-width:100%}button{background:#14784d;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}article{padding:12px 0;border-bottom:1px solid #e5eae6;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.msg{background:#eef5ef;padding:12px;border-radius:10px;white-space:pre-wrap}small{color:#61766a}a{color:#14784d}</style></head><body><main><h1>إدارة المستخدمين والصلاحيات</h1><small>دوام الميسر — 0.2.11-dev (صلاحيات تجريبية)</small><p>حدد المستخدم ثم عدّل صلاحياته المحفوظة. «افتراضي» يعيد حكم الدور الأساسي.</p><div class="msg" id="msg">جارٍ التحقق من تسجيل الدخول...</div><p><label for="user">المستخدم: </label><select id="user" disabled></select></p><section id="items"></section><p><button id="save" disabled>حفظ الصلاحيات</button> <button id="reload" type="button">إعادة تحميل</button></p><p><a href="./">العودة إلى التطبيق</a></p></main><script>
const names={'device.sync':'جلب بصمات الجهاز','device.attendance.view':'عرض بصمات الجهاز','device.correction':'تصحيح بصمات الجهاز','employees.view':'عرض بيانات العاملين','employees.edit':'تعديل بيانات العاملين','attendance.manual':'إدخال الحضور يدويًا','reports.view':'عرض التقارير','users.manage':'إدارة المستخدمين'};
const msg=document.getElementById('msg'),user=document.getElementById('user'),items=document.getElementById('items'),save=document.getElementById('save');let records=[],keys=[],original={},dirty={};
async function api(path,opts){let r=await fetch('/api/'+path,{credentials:'same-origin',cache:'no-store',...opts});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
function render(){const id=user.value;dirty={};items.replaceChildren();for(const key of keys){const row=document.createElement('article'),label=document.createElement('span'),select=document.createElement('select');label.textContent=names[key]||key;select.dataset.key=key;for(const [value,title] of [['default','افتراضي بحسب الدور'],['allow','سماح'],['deny','منع']]){const opt=document.createElement('option');opt.value=value;opt.textContent=title;select.append(opt)}const cur=original[id+'|'+key];select.value=cur===true?'allow':cur===false?'deny':'default';select.addEventListener('change',()=>{dirty[key]=select.value;save.disabled=false});row.append(label,select);items.append(row)}save.disabled=true}
async function load(){save.disabled=true;user.disabled=true;msg.textContent='جارٍ تحميل بيانات المستخدمين...';try{const [u,p]=await Promise.all([api('users'),api('permissions')]);records=u.items||[];keys=p.keys||[];original={};for(const item of p.items||[])original[item.user_id+'|'+item.permission_key]=item.allowed===1;const selected=user.value;user.replaceChildren();for(const record of records){const opt=document.createElement('option');opt.value=record.id;opt.textContent=record.name+' — '+record.role;user.append(opt)}if(records.some(x=>x.id===selected))user.value=selected;user.disabled=!records.length;render();msg.textContent=records.length?'اختر المستخدم وعدّل الصلاحيات ثم احفظ.':'لا يوجد مستخدمون';}catch(e){msg.textContent='تعذر فتح إدارة المستخدمين: '+e.message+'\nتأكد من الدخول بحساب المدير وإنشاء جدول الصلاحيات.';items.replaceChildren()}}
user.addEventListener('change',render);document.getElementById('reload').addEventListener('click',load);
save.addEventListener('click',async()=>{const changes=Object.entries(dirty);if(!changes.length)return;save.disabled=true;msg.textContent='جارٍ حفظ '+changes.length+' تعديل...';try{for(const [permission_key,v] of changes){await api('permissions',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:user.value,permission_key,allowed:v==='default'?null:v==='allow'})})}msg.textContent='تم حفظ التغييرات، وجارٍ إعادة تحميل الصلاحيات.';await load()}catch(e){msg.textContent='لم يكتمل حفظ جميع التغييرات: '+e.message+'\nاضغط إعادة تحميل لمراجعة المحفوظ.';save.disabled=false}});
load();</script></body></html>
